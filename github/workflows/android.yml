name: Build KEIBA LAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/jp/keibalab/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/jp/keibalab/app/
          cp AndroidManifest.xml app/src/main/
          cp index.html app/src/main/assets/
          cp styles.xml app/src/main/res/values/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'KEIBA-LAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'jp.keibalab.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'jp.keibalab.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA-LAB-APK
          path: app/build/outputs/apk/debug/app-debug.apk