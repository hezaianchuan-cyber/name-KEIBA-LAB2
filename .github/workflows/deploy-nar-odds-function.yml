name: Deploy NAR one-minute odds capture function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/nar-odds-capture/**'
      - 'supabase/functions/nar-model-snapshot-archive/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-nar-odds-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NAR_CAPTURE_TOKEN: ${{ secrets.NAR_CAPTURE_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$NAR_CAPTURE_TOKEN" || { echo "Missing NAR_CAPTURE_TOKEN repository secret"; exit 1; }
          supabase secrets set NAR_CAPTURE_TOKEN="$NAR_CAPTURE_TOKEN" --project-ref mwiinzmnoludksnfnjaa --yes
          supabase functions deploy nar-odds-capture --project-ref mwiinzmnoludksnfnjaa --yes
          supabase functions deploy nar-model-snapshot-archive --project-ref mwiinzmnoludksnfnjaa --yes
