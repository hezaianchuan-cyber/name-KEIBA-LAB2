name: Research flat trio diagnostics by venue distance and ticket policy

on:
  push:
    branches:
      - research/flat-axis-win-blend
    paths:
      - '.github/workflows/research-flat-trio-deep-diagnostics.yml'
      - 'scripts/research_flat_trio_deep_diagnostics.py'
      - 'scripts/research_flat_trio_ticket_comparison.py'
      - 'scripts/research_flat_axis_win_blend.py'
      - 'scripts/nar_backtest.py'
      - 'scripts/nar_ml_challenger_backtest.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-trio-deep-diagnostics
  cancel-in-progress: false

jobs:
  flat-trio-deep-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-axis-win-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Compile research scripts
        run: python -m py_compile scripts/nar_backtest.py scripts/nar_ml_challenger_backtest.py scripts/research_flat_axis_win_blend.py scripts/research_flat_trio_deep_diagnostics.py
      - name: Run venue, distance, payout and ticket-policy diagnostics
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_trio_deep_diagnostics.py
      - name: Upload deep diagnostics report
        uses: actions/upload-artifact@v4
        with:
          name: flat-trio-deep-diagnostics
          path: data/flat-trio-deep-diagnostics.json
          if-no-files-found: error
          retention-days: 30
