name: Test axis-conditional trio partner ranker

on:
  push:
    branches: [research/conditional-axis-pair-ranker]
    paths:
      - 'scripts/nar_axis_conditional_pair_ranker.py'
      - 'tests/test_nar_axis_conditional_pair_ranker.py'
      - '.github/workflows/test-axis-conditional-pair-ranker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install scikit-learn
      - name: Compile and test
        run: |
          python -m py_compile scripts/nar_trio_learned_compatibility.py scripts/nar_axis_conditional_pair_ranker.py
          python -m unittest discover -s tests -p 'test_nar_axis_conditional_pair_ranker.py'
