name: Publish daily official NAR payouts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_daily_payouts.py'
      - 'index.html'
      - '.github/workflows/nar-daily-payouts.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *" # 20:30 JST, after most NAR race meetings
    - cron: "30 14 * * *" # 23:30 JST, retry for late official result publication

permissions:
  contents: write

concurrency:
  group: nar-daily-payouts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore monthly archive cache
        uses: actions/cache@v4
        with:
          path: .cache/nar-monthly
          key: nar-monthly-payouts-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-payouts-${{ runner.os }}-
            nar-monthly-v1-${{ runner.os }}-
      - name: Build daily official payout report
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
        run: python3 scripts/nar_daily_payouts.py
      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/daily-payouts.json /tmp/daily-payouts.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/daily-payouts.json data/daily-payouts.json
            git add data/daily-payouts.json
            if git diff --cached --quiet; then
              echo "Daily payout report is already current."
              exit 0
            fi
            git commit -m "Update daily official NAR payout results"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Failed to publish daily payout report."
          exit 1
