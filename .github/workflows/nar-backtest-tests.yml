name: NAR backtest unit tests

on:
  pull_request:
    paths:
      - 'scripts/nar_backtest.py'
      - 'tests/test_nar_backtest.py'
      - '.github/workflows/nar-backtest-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run NAR backtest unit tests
        run: python3 -m unittest discover -s tests -p 'test_nar_backtest.py'
