name: Deploy KEIBA LAB Web
# Keep web deployment available after backtest and app-source updates.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supabase/functions/nar-odds-capture/_shared/trio_strategy.js'
      - 'tests/trio_strategy.test.js'
      - 'data/daily-payouts.json'
      - 'data/model-g4-preoff-backtest.json'
      - 'data/daily-review.json'
      - 'data/live-model.json'
      - 'data/live-history.json'
      - 'data/auto-ticket-plans.json'
      - 'data/latest-race.zip'
      - 'data/latest-odds.zip'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/web.yml'
  workflow_dispatch:
  # Commits made with GITHUB_TOKEN do not start push workflows.
  # Deploy after the payout publisher commits the official same-day results.
  workflow_run:
    workflows: ["Publish daily official NAR payouts", "Capture NAR pre-off odds every five minutes", "G4 real pre-off odds backtest", "NAR recent five-day D4 backtest"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for strategy tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test shared prediction strategy
        run: node --test tests/trio_strategy.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
