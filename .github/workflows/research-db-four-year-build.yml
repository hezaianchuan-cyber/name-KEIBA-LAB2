name: KEIBALAB Four-Year Historical Research DB Build

on:
  workflow_dispatch:
  push:
    branches:
      - research/keibalab-db-foundation
    paths:
      - ".github/workflows/research-db-four-year-build.yml"

permissions:
  contents: read

jobs:
  build-four-year-database:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/keibalab-db-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize SQLite and import frozen A45 pre-race records
        run: python scripts/import_research_db.py

      - name: Import official NAR monthly archives (2022-11 to 2026-10)
        run: |
          python scripts/import_nar_archive_to_research_db.py \
            --start-date 2022-11-01 --end-date 2026-10-31

      - name: Verify four-year coverage, Banei separation and integrity
        run: |
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("data/keibalab-research.sqlite")
          db.execute("PRAGMA foreign_keys=ON")
          counts = {
              table: db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              for table in ("races", "runners", "official_results", "payouts",
                            "model_predictions", "odds_snapshots", "ingestion_batches")
          }
          by_type = dict(db.execute(
              "SELECT race_type,COUNT(*) FROM races GROUP BY race_type"
          ).fetchall())
          coverage = db.execute(
              "SELECT MIN(race_date),MAX(race_date),COUNT(DISTINCT race_date) "
              "FROM races WHERE source='official_nar_monthly_archive'"
          ).fetchone()
          trio_payouts = db.execute(
              "SELECT COUNT(*) FROM payouts WHERE bet_type='trio'"
          ).fetchone()[0]
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          violations = db.execute("PRAGMA foreign_key_check").fetchall()
          duplicate_keys = db.execute(
              "SELECT race_date,venue,race_number,COUNT(*) FROM races "
              "GROUP BY race_date,venue,race_number HAVING COUNT(*)>1"
          ).fetchall()
          report = {
              "counts": counts, "race_type_counts": by_type,
              "official_archive_coverage": {
                  "first_date": coverage[0], "last_date": coverage[1],
                  "distinct_dates": coverage[2]
              },
              "trio_payout_rows": trio_payouts,
              "integrity_check": integrity,
              "foreign_key_violations": violations,
              "duplicate_race_keys": duplicate_keys
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert counts["races"] >= 45000, "Historical race coverage is unexpectedly small"
          assert counts["runners"] >= 450000, "Historical runner coverage is unexpectedly small"
          assert coverage[0] <= "2022-11-30"
          assert coverage[1] >= "2026-10-01"
          assert by_type.get("flat", 0) > 0
          assert integrity == "ok"
          assert not violations
          assert not duplicate_keys
          assert trio_payouts > 0
          PY

      - name: Upload four-year SQLite database
        uses: actions/upload-artifact@v4
        with:
          name: keibalab-research-sqlite-four-years
          path: data/keibalab-research.sqlite
          retention-days: 90
          if-no-files-found: error
