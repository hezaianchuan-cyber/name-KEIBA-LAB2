name: Research axis distance ablation

on:
  push:
    branches:
      - research/conditional-axis-pair-ranker
    paths:
      - 'scripts/nar_axis_distance_ablation.py'
      - 'scripts/horse_evaluation_model.py'
      - 'scripts/nar_backtest.py'
      - 'scripts/nar_ml_challenger_backtest.py'
      - 'scripts/nar_axis_pair_walkforward_backtest.py'

permissions:
  contents: read

concurrency:
  group: research-axis-distance-ablation
  cancel-in-progress: false

jobs:
  distance-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/conditional-axis-pair-ranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn lightgbm
      - name: Compile research modules
        run: |
          python -m py_compile scripts/nar_backtest.py scripts/nar_ml_challenger_backtest.py scripts/nar_axis_pair_walkforward_backtest.py scripts/nar_axis_distance_ablation.py
      - name: Run one-factor distance ablation
        run: python scripts/nar_axis_distance_ablation.py
      - name: Upload distance ablation report
        uses: actions/upload-artifact@v4
        with:
          name: axis-distance-ablation
          path: data/axis-distance-ablation.json
          if-no-files-found: error
          retention-days: 30
