name: Research Banei carried-weight ablation

on:
  push:
    branches:
      - research/conditional-axis-pair-ranker
    paths:
      - '.github/workflows/research-banei-carried-weight-ablation.yml'
      - 'scripts/research_banei_carried_weight_ablation.py'
      - 'scripts/nar_backtest.py'

permissions:
  contents: read

concurrency:
  group: research-banei-carried-weight-ablation
  cancel-in-progress: false

jobs:
  carried-weight-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/conditional-axis-pair-ranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn lightgbm
      - name: Compile experiment and parser
        run: python -m py_compile scripts/nar_backtest.py scripts/research_banei_carried_weight_ablation.py
      - name: Run chronological carried-weight ablation
        run: python scripts/research_banei_carried_weight_ablation.py
      - name: Upload Banei carried-weight report
        uses: actions/upload-artifact@v4
        with:
          name: banei-carried-weight-ablation
          path: data/banei-carried-weight-ablation.json
          if-no-files-found: error
          retention-days: 30
