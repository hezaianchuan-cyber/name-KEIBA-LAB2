name: Research LambdaRank November forward validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-lambdarank-november-forward-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile scripts
        run: python -m py_compile scripts/research_flat_lambdarank_november_forward_validation.py scripts/research_flat_lambdarank_feature_ablation.py scripts/nar_ml_challenger_backtest.py scripts/nar_backtest.py
      - name: Run locked November forward validation
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_lambdarank_november_forward_validation.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lambdarank-november-forward-validation
          path: data/flat-lambdarank-november-forward-validation.json
          if-no-files-found: warn
          retention-days: 90
