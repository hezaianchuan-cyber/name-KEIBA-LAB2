name: JRA free-data feasibility probe

on:
  push:
    branches: [jra-free-data-pilot]
    paths:
      - "scripts/jra_free_data_probe.py"
      - "tests/test_jra_free_data_probe.py"
      - ".github/workflows/jra-free-data-probe.yml"

permissions:
  contents: write

concurrency:
  group: jra-free-data-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated pilot branch
        uses: actions/checkout@v4
        with:
          ref: jra-free-data-pilot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test parser
        run: python3 -m unittest discover -s tests -p "test_jra_free_data_probe.py" -v

      - name: Compile probe
        run: python3 -m py_compile scripts/jra_free_data_probe.py

      - name: Fetch one full JRA race day at a modest request rate
        run: python3 scripts/jra_free_data_probe.py

      - name: Validate the three-venue race-day sample
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/jra-free-data-probe.json").read_text(encoding="utf-8"))
          assert report["runner_count"] >= 10, f"Sample race has too few runners: {report['runner_count']}"
          assert report["trifecta_payout"], "Sample race has no parsed trifecta payout"
          batch = report["batch"]
          assert batch["race_count"] >= 30, f"Too few races parsed: {batch['race_count']}"
          assert batch["venue_count"] == 3, f"Expected three venues: {batch['venues']}"
          assert batch["trifecta_payout_count"] >= 30, f"Too few trifecta payouts: {batch['trifecta_payout_count']}"
          assert batch["runner_count_total"] >= 300, f"Too few runners parsed: {batch['runner_count_total']}"
          print("JRA_FREE_DAY_PROBE=PASS")
          print("RACES:", batch["race_count"], "VENUES:", batch["venues"])
          print("RUNNERS:", batch["runner_count_total"])
          print("TRIFECTA PAYOUTS:", batch["trifecta_payout_count"])
          print("ERRORS:", batch["errors"])
          PY

      - name: Publish probe result to pilot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra-free-data-probe.json
          if git diff --cached --quiet; then
            echo "Probe output is unchanged."
            exit 0
          fi
          git commit -m "Record JRA full-day free-data probe"
          git push origin HEAD:jra-free-data-pilot
