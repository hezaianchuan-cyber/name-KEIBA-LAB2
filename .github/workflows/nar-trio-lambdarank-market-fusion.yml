name: Research NAR LambdaRank market-fusion trio five-day test

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_trio_lambdarank_market_fusion_5day.py'
      - 'tests/test_nar_trio_lambdarank_market_fusion.py'
      - '.github/workflows/nar-trio-lambdarank-market-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-trio-lambdarank-market-fusion-5day
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
          key: nar-trio-fusion-research-v1
          restore-keys: |
            nar-monthly-v1-
            nar-parsed-v1-
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy lightgbm scikit-learn
      - name: Compile and test research code
        run: |
          python -m py_compile scripts/nar_trio_lambdarank_market_fusion_5day.py scripts/nar_trio_compatibility.py scripts/nar_trio_learned_compatibility.py scripts/nar_ml_challenger_backtest.py scripts/nar_bet_type_comparison.py scripts/nar_backtest.py
          python -m unittest discover -s tests -p 'test_nar_trio_lambdarank_market_fusion.py'
      - name: Run five-day LambdaRank and pre-off market fusion test
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/nar_trio_lambdarank_market_fusion_5day.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: nar-trio-lambdarank-market-fusion-5day
          path: data/nar-trio-lambdarank-market-fusion-5day.json
          if-no-files-found: error
          retention-days: 30
