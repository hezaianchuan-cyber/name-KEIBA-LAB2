name: Run seven-day axis longshot research
on:
  pull_request:
    branches:
      - research/axis-longshot-10-ticket
    paths:
      - 'scripts/nar_exacta_research.py'
      - 'scripts/nar_exacta_conditional_model.py'
      - 'scripts/nar_trio_lambdarank_market_fusion_5day.py'
      - 'scripts/nar_trio_candidate_comparison.py'
      - 'tests/test_nar_trio_candidate_comparison.py'
      - 'tests/test_nar_exacta_research.py'
      - 'tests/test_nar_exacta_conditional_model.py'
      - '.github/workflows/axis-longshot-seven-day-backtest.yml'
  push:
    branches:
      - research/axis-longshot-10-ticket
    paths:
      - 'scripts/nar_axis_longshot_research.py'
      - 'scripts/nar_trio_combination_model.py'
      - 'scripts/nar_trio_candidate_comparison.py'
      - 'scripts/nar_trio_lambdarank_market_fusion_5day.py'
      - 'tests/test_nar_axis_longshot_research.py'
      - 'tests/test_nar_trio_combination_model.py'
      - 'tests/test_nar_trio_candidate_comparison.py'
      - '.github/workflows/axis-longshot-seven-day-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axis-longshot-seven-day-research
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
          key: axis-longshot-research-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-
            nar-parsed-v1-
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn lightgbm
      - name: Compile and run focused tests
        run: |
          python -m py_compile scripts/nar_axis_longshot_research.py scripts/nar_trio_combination_model.py scripts/nar_trio_candidate_comparison.py scripts/nar_trio_lambdarank_market_fusion_5day.py
          if [ -f scripts/nar_exacta_research.py ]; then python -m py_compile scripts/nar_exacta_research.py scripts/nar_exacta_conditional_model.py; fi
          python -m unittest discover -s tests -p 'test_nar_axis_longshot_research.py'
          python -m unittest discover -s tests -p 'test_nar_trio_combination_model.py'
          python -m unittest discover -s tests -p 'test_nar_trio_candidate_comparison.py'
          python -m unittest discover -s tests -p 'test_nar_trio_lambdarank_market_fusion.py'
          if [ -f tests/test_nar_exacta_research.py ]; then python -m unittest discover -s tests -p 'test_nar_exacta_research.py'; fi
          if [ -f tests/test_nar_exacta_conditional_model.py ]; then python -m unittest discover -s tests -p 'test_nar_exacta_conditional_model.py'; fi
      - name: Run seven-day chronological research backtest
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_RESEARCH_TEST_DAYS: "7"
          NAR_RESEARCH_DEV_FRACTION: "0.60"
          NAR_RESEARCH_OUTPUT: data/nar-trio-lambdarank-market-fusion-7day.json
        run: python scripts/nar_trio_lambdarank_market_fusion_5day.py
      - name: Upload seven-day report
        uses: actions/upload-artifact@v4
        with:
          name: axis-longshot-seven-day-research
          path: data/nar-trio-lambdarank-market-fusion-7day.json
          if-no-files-found: error
          retention-days: 30
