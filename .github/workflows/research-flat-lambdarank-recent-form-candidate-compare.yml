name: Research LambdaRank recent-form candidate comparison
on:
  push:
    branches: [research/lambdarank-recent-form-candidate-compare]
    paths:
      - 'scripts/research_flat_lambdarank_recent_form_candidate_compare.py'
      - '.github/workflows/research-flat-lambdarank-recent-form-candidate-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-lambdarank-recent-form-candidate-compare
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile scripts
        run: python -m py_compile scripts/research_flat_lambdarank_recent_form_candidate_compare.py scripts/research_flat_lambdarank_feature_ablation.py scripts/nar_ml_challenger_backtest.py scripts/nar_backtest.py
      - name: Run development-only candidate comparison
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_lambdarank_recent_form_candidate_compare.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lambdarank-recent-form-candidate-compare
          path: data/flat-lambdarank-recent-form-candidate-compare.json
          if-no-files-found: warn
          retention-days: 30
