name: Research flat LambdaRank next-generation benchmark
on:
  workflow_dispatch:
  push:
    branches: [research/lambdarank-nextgen]
    paths:
      - 'scripts/research_flat_lambdarank_nextgen.py'
      - 'scripts/nar_ml_challenger_backtest.py'
      - 'scripts/nar_backtest.py'
      - '.github/workflows/research-flat-lambdarank-nextgen.yml'
permissions:
  contents: read
concurrency:
  group: research-flat-lambdarank-nextgen
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile research scripts
        run: |
          python -m py_compile \
            scripts/research_flat_lambdarank_nextgen.py \
            scripts/nar_ml_challenger_backtest.py \
            scripts/nar_backtest.py
      - name: Run flat LambdaRank next-generation benchmark
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_ODDS_CACHE_DIR: .cache/nar-odds-monthly
        run: python scripts/research_flat_lambdarank_nextgen.py
      - name: Upload LambdaRank report and per-runner predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lambdarank-nextgen
          path: |
            data/flat-lambdarank-nextgen.json
            data/flat-lambdarank-nextgen-predictions.csv
          if-no-files-found: warn
          retention-days: 30
