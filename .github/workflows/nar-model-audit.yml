name: NAR model design and leakage audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_backtest.py'
      - 'scripts/capture_nar_odds.py'
      - 'scripts/nar_pipeline_audit.py'
      - 'tests/test_prediction_lock.py'
      - '.github/workflows/nar-model-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-model-audit
  cancel-in-progress: false

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backtest and audit code
        run: python3 -m py_compile scripts/nar_backtest.py scripts/capture_nar_odds.py scripts/nar_pipeline_audit.py
      - name: Verify immutable pre-off prediction locks
        run: python3 -m unittest discover -s tests -p 'test_prediction_lock.py'
      - name: Run model and data leakage audit
        run: python3 scripts/nar_pipeline_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nar-pipeline-audit
          path: data/nar-pipeline-audit.json
          if-no-files-found: error
