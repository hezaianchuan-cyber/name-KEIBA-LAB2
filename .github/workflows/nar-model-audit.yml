name: NAR model and data quality audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_backtest.py'
      - 'scripts/nar_pipeline_audit.py'
      - 'tests/**'
      - '.github/workflows/nar-model-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-model-audit
  cancel-in-progress: false

jobs:
  regression-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run pipeline audit
        run: python3 scripts/nar_pipeline_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nar-pipeline-audit
          path: data/nar-pipeline-audit.json
          if-no-files-found: error
