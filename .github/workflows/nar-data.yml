name: Fetch NAR official data archives

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# This workflow only refreshes and commits source data.
# GitHub Pages is deployed exclusively by web.yml.
concurrency:
  group: nar-official-data-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official NAR archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/keiba-lab-data
          BASE="https://www.keiba.go.jp/KeibaWeb/DataDownload"
          fetch_zip() {
            name="$1"
            endpoint="$2"
            tmp="/tmp/keiba-lab-data/${name}.zip"
            out="/tmp/keiba-lab-data/${name}.zip"
            if curl -fLsS --retry 2 --retry-delay 3 --max-time 90 "$BASE/$endpoint" -o "$tmp" && unzip -t "$tmp" >/dev/null 2>&1; then
              echo "$name=updated"
            elif [ -s "data/${name}.zip" ] && unzip -t "data/${name}.zip" >/dev/null 2>&1; then
              cp "data/${name}.zip" "$out"
              echo "$name=kept_previous"
            else
              rm -f "$out"
              echo "$name=unavailable"
            fi
          }
          fetch_zip latest-race "RaceDataDownload?type=daily"
          fetch_zip latest-odds "OddsDataDownload?type=daily"

          python3 - <<'PY'
          import json, os, datetime
          root = "/tmp/keiba-lab-data"
          state = {}
          for name in ("latest-race", "latest-odds"):
              path = f"{root}/{name}.zip"
              state[name] = {
                  "available": os.path.isfile(path),
                  "bytes": os.path.getsize(path) if os.path.isfile(path) else 0,
              }
          state["updatedAtUtc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open(f"{root}/status.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False)
          print(json.dumps(state, ensure_ascii=False))
          PY

      - name: Commit refreshed archives for the Pages deployer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            for file in latest-race.zip latest-odds.zip status.json; do
              if [ -f "/tmp/keiba-lab-data/$file" ]; then
                cp "/tmp/keiba-lab-data/$file" "data/$file"
              fi
            done
            git add -f data/latest-race.zip data/latest-odds.zip
            git add data/status.json
            if git diff --cached --quiet; then
              echo "No official archive or status changes."
              exit 0
            fi
            git commit -m "Refresh official NAR data archives"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update; retrying (attempt $attempt)"
            sleep 2
          done
          echo "Could not publish refreshed archives after five attempts."
          exit 1
