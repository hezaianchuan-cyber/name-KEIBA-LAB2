name: Fetch NAR official data for PC

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/odds-snapshots/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download latest official NAR ZIP files
        shell: bash
        run: |
          set +e
          mkdir -p data
          BASE="https://www.keiba.go.jp/KeibaWeb/DataDownload"
          PAGES="https://hezaianchuan-cyber.github.io/name-KEIBA-LAB2/data"
          fetch_zip() {
            name="$1"
            endpoint="$2"
            tmp="data/${name}.zip.tmp"
            out="data/${name}.zip"
            if curl -fLsS --retry 2 --retry-delay 3 --max-time 90 "$BASE/$endpoint" -o "$tmp" && unzip -t "$tmp" >/dev/null 2>&1; then
              mv "$tmp" "$out"
              echo "$name=updated"
            else
              rm -f "$tmp"
              if curl -fLsS --max-time 45 "$PAGES/${name}.zip" -o "$out" && unzip -t "$out" >/dev/null 2>&1; then
                echo "$name=kept_previous"
              else
                rm -f "$out"
                echo "$name=unavailable"
              fi
            fi
          }
          fetch_zip latest-race "RaceDataDownload?type=daily"
          fetch_zip latest-odds "OddsDataDownload?type=daily"
          echo "=== ZIP entry diagnostics ==="
          for archive in data/*.zip; do
            [ -f "$archive" ] || continue
            echo "--- $archive ---"
            unzip -Z1 "$archive" | head -40
          done
          python - <<'PY'
          import zipfile, glob, re, unicodedata
          for path in glob.glob("data/*.zip"):
              print("INSPECT", path)
              try:
                  with zipfile.ZipFile(path) as z:
                      for name in z.namelist():
                          base=name.replace("\\\\","/").split("/")[-1]
                          n=unicodedata.normalize("NFKC",base).lower()
                          kind=("horses" if re.search(r"horselist|horse.?list|出馬表",n) else "races" if re.search(r"racelist|race.?list|レース一覧",n) else "odds" if re.search(r"odds|オッズ",n) else "payouts" if re.search(r"payback|payout|払戻",n) else "-")
                          if base and not name.endswith("/"):
                              print("ENTRY", repr(name), "CLASS", kind, "SIZE", z.getinfo(name).file_size)
              except Exception as e:
                  print("ZIP_ERROR", repr(e))
          PY
          python - <<'PY'
          import json, os, datetime
          names = ["latest-race", "latest-odds"]
          state = {}
          for name in names:
              path = f"data/{name}.zip"
              state[name] = {"available": os.path.isfile(path), "bytes": os.path.getsize(path) if os.path.isfile(path) else 0}
          state["updatedAtUtc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open("data/status.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False)
          print(json.dumps(state, ensure_ascii=False))
          PY

      - name: Capture pre-off odds snapshots
        run: |
          python3 scripts/capture_nar_odds.py
          if [ -d data/odds-snapshots ]; then
            cp -a data/odds-snapshots /tmp/odds-snapshots
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              mkdir -p data
              cp -a /tmp/odds-snapshots data/
              git add data/odds-snapshots
              if git diff --cached --quiet; then
                echo "No new pre-off odds snapshots"
                break
              fi
              git commit -m "Archive official pre-off odds snapshots"
              if git push origin HEAD:main; then
                break
              fi
              echo "Snapshot push conflict; retry $attempt"
              sleep 2
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website and latest data
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website and data
        id: deployment
        uses: actions/deploy-pages@v4
