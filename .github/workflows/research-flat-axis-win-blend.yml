name: Research flat-racing winner-similarity and win-specialist blend

on:
  push:
    branches:
      - research/flat-axis-win-blend
    paths:
      - '.github/workflows/research-flat-axis-win-blend.yml'
      - 'scripts/research_flat_axis_win_blend.py'
      - 'scripts/nar_ml_challenger_backtest.py'
      - 'scripts/nar_backtest.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-axis-win-blend
  cancel-in-progress: false

jobs:
  flat-axis-win-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-axis-win-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Compile research scripts
        run: python -m py_compile scripts/nar_backtest.py scripts/nar_ml_challenger_backtest.py scripts/research_flat_axis_win_blend.py
      - name: Run flat-racing blend experiment
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_axis_win_blend.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: flat-axis-win-blend-research
          path: data/flat-axis-win-blend-research.json
          if-no-files-found: error
          retention-days: 30
