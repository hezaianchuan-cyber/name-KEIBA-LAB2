name: Research flat-only model benchmark
on:
  workflow_dispatch:
  push:
    branches: [research/flat-only-model-benchmark]
    paths:
      - 'scripts/research_flat_only_model_benchmark.py'
      - 'scripts/nar_ml_challenger_backtest.py'
      - 'scripts/nar_bet_type_comparison.py'
      - 'scripts/nar_backtest.py'
      - '.github/workflows/research-flat-only-model-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: research-flat-only-model-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile research scripts
        run: |
          python -m py_compile \
            scripts/research_flat_only_model_benchmark.py \
            scripts/nar_ml_challenger_backtest.py \
            scripts/nar_bet_type_comparison.py \
            scripts/nar_backtest.py
      - name: Run flat-only benchmark
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_ODDS_CACHE_DIR: .cache/nar-odds-monthly
        run: python scripts/research_flat_only_model_benchmark.py
      - name: Upload flat-only benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-only-model-benchmark
          path: data/flat-only-model-benchmark.json
          if-no-files-found: warn
          retention-days: 30
