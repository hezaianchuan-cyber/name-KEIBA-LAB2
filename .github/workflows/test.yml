name: Validate KEIBA LAB backtest

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backtest
        run: python -m py_compile scripts/nar_backtest.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
