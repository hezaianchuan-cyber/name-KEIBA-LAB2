name: Validate KEIBA LAB backtest

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backtest
        run: python -m py_compile scripts/*.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated model snapshot archive function
        run: deno check supabase/functions/nar-model-snapshot-archive/index.ts
      - name: Type-check one-minute odds capture function
        run: deno check supabase/functions/nar-odds-capture/index.ts
      - name: Check embedded app JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/keiba-lab.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/keiba-lab.js
      - name: Run shared trio strategy tests
        run: node --test tests/trio_strategy.test.js
      - name: Run pipeline static safety audit
        run: python scripts/nar_pipeline_audit.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run G4 with merged pre-off model snapshot sources
        run: python scripts/nar_model_g4_preoff_backtest.py
      - name: Validate merged model snapshot coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/model-g4-preoff-backtest.json").read_text(encoding="utf-8"))
          diagnostics = report.get("diagnostics", {})
          status = diagnostics.get("model_snapshot_table_status")
          if status == "loaded_merged_with_github_fallback":
              github_rows = diagnostics.get("github_model_snapshot_rows", 0)
              merged_rows = diagnostics.get("merged_model_snapshot_rows", 0)
              if merged_rows < github_rows:
                  raise SystemExit("Merged model snapshots dropped GitHub archive rows")
              print("G4 merged snapshot rows:", merged_rows,
                    "GitHub fallback-only races:", diagnostics.get("github_fallback_only_races", 0))
          elif status not in ("empty_using_github_fallback", "unavailable_using_github_fallback"):
              raise SystemExit("Unexpected model snapshot source status: " + str(status))
          else:
              print("G4 is using the available GitHub fallback:", status)
          PY
