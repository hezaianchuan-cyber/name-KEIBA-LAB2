name: Validate KEIBA LAB backtest

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only pair-model test dependency
        run: python -m pip install --disable-pip-version-check scikit-learn
      - name: Compile backtest
        id: compile
        run: python -m py_compile scripts/*.py
      - uses: denoland/setup-deno@v2
        id: deno-setup
        continue-on-error: true
        with:
          deno-version: v2.x
      - name: Retry Deno installation from the official distribution host
        if: steps.deno-setup.outcome != 'success'
        run: |
          set -euo pipefail
          DENO_VERSION="2.9.8"
          # Use Deno's distribution host rather than repeating the GitHub
          # Releases URL that may be returning HTTP 504.
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 240 \
            "https://dl.deno.land/release/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" \
            --output /tmp/deno.zip
          python -m zipfile -e /tmp/deno.zip /tmp/deno-install
          sudo install /tmp/deno-install/deno /usr/local/bin/deno
          deno --version
      - name: Type-check isolated model snapshot archive function
        id: deno-typecheck
        run: deno check supabase/functions/nar-model-snapshot-archive/index.ts
      - name: Check embedded app JavaScript syntax
        id: app-js
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/keiba-lab.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/keiba-lab.js
      - name: Run shared trio strategy tests
        id: trio-tests
        run: node --test tests/trio_strategy.test.js
      - name: Run pipeline static safety audit
        id: safety-audit
        run: python scripts/nar_pipeline_audit.py
      - name: Run regression tests
        id: regression-tests
        run: python -m unittest discover -s tests -v
      # Full Supabase-backed G4 runs are owned by nar-model-g4-preoff.yml.
      # Keep this validation workflow offline to avoid duplicate concurrent
      # database scans competing with the scheduled evaluator.

      - name: Write validation status summary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          DENO_OUTCOME: ${{ steps.deno-typecheck.outcome }}
          APP_JS_OUTCOME: ${{ steps.app-js.outcome }}
          TRIO_OUTCOME: ${{ steps.trio-tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.safety-audit.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression-tests.outcome }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## KEIBA LAB — テスト状況"
            echo
            echo "| 検証項目 | 結果 |"
            echo "|---|---|"
            echo "| Python構文チェック | ${COMPILE_OUTCOME:-未実行} |"
            echo "| Supabase関数型チェック | ${DENO_OUTCOME:-未実行} |"
            echo "| Web版JavaScript構文 | ${APP_JS_OUTCOME:-未実行} |"
            echo "| 3連複戦略テスト | ${TRIO_OUTCOME:-未実行} |"
            echo "| パイプライン安全監査 | ${AUDIT_OUTCOME:-未実行} |"
            echo "| 回帰テスト | ${REGRESSION_OUTCOME:-未実行} |"
            echo
            echo "総合結果: ${JOB_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
