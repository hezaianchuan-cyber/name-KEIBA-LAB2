name: Research flat-only original model feature audit

on:
  push:
    branches:
      - research/flat-model-feature-audit
    paths:
      - '.github/workflows/research-flat-model-feature-audit.yml'
      - 'scripts/research_flat_model_feature_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-model-feature-audit
  cancel-in-progress: false

jobs:
  flat-feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-model-feature-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
            .cache/nar-odds-monthly
          key: nar-flat-feature-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-${{ runner.os }}-
            nar-parsed-v1-${{ runner.os }}-
            nar-odds-monthly-v1-${{ runner.os }}-
      - name: Compile research and model code
        run: python -m py_compile scripts/nar_backtest.py scripts/horse_evaluation_model.py scripts/research_flat_model_feature_audit.py
      - name: Run flat-only feature and weight audit
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_ODDS_CACHE_DIR: .cache/nar-odds-monthly
        run: python scripts/research_flat_model_feature_audit.py
      - name: Upload flat-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: flat-only-original-model-feature-audit
          path: data/research-flat-model-feature-audit.json
          if-no-files-found: error
          retention-days: 30
