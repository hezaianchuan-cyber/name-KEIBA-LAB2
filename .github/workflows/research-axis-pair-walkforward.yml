name: Research axis-conditional pair walk-forward backtest

on:
  push:
    branches:
      - research/conditional-axis-pair-ranker
    paths:
      - 'scripts/nar_axis_pair_walkforward_backtest.py'
      - 'scripts/nar_ml_challenger_backtest.py'
      - 'scripts/nar_axis_conditional_pair_ranker.py'
      - 'scripts/nar_trio_learned_compatibility.py'
      - 'scripts/nar_backtest.py'
      - '.github/workflows/research-axis-pair-walkforward.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-axis-pair-walkforward
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/conditional-axis-pair-ranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check scikit-learn lightgbm
      - name: Compile research modules
        run: |
          python -m py_compile scripts/nar_backtest.py scripts/nar_trio_learned_compatibility.py scripts/nar_axis_conditional_pair_ranker.py scripts/nar_axis_pair_walkforward_backtest.py
      - name: Run chronological pre-off pair research
        run: python scripts/nar_axis_pair_walkforward_backtest.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: axis-conditional-pair-backtest
          path: data/axis-conditional-pair-backtest.json
          if-no-files-found: error
          retention-days: 30
