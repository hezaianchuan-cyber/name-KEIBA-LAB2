name: Capture NAR pre-off odds every five minutes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nar_odds.py'
      - '.github/workflows/nar-preoff-odds.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: nar-preoff-odds-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current official NAR race and odds archives
        shell: bash
        run: |
          set +e
          mkdir -p data
          BASE="https://www.keiba.go.jp/KeibaWeb/DataDownload"
          fetch_zip() {
            name="$1"
            endpoint="$2"
            tmp="data/${name}.zip.tmp"
            out="data/${name}.zip"
            if curl -fLsS --retry 1 --retry-delay 2 --max-time 45 "$BASE/$endpoint" -o "$tmp" && unzip -t "$tmp" >/dev/null 2>&1; then
              mv "$tmp" "$out"
              echo "$name=updated"
            else
              rm -f "$tmp" "$out"
              echo "$name=unavailable"
            fi
          }
          fetch_zip latest-race "RaceDataDownload?type=daily"
          fetch_zip latest-odds "OddsDataDownload?type=daily"

      - name: Capture timestamped pre-off snapshots
        run: python3 scripts/capture_nar_odds.py

      - name: Commit new snapshots only
        shell: bash
        run: |
          set -e
          if [ ! -d data/odds-snapshots ]; then
            echo "No snapshot directory created; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds-snapshots data/odds-capture-status.json
          if git diff --cached --quiet; then
            echo "No new snapshot or status changes."
            exit 0
          fi
          git commit -m "Archive official pre-off odds snapshots and capture status"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase capture commit; preserving local commit and retrying."
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Snapshot push conflict; retry $attempt"
            sleep 2
          done
          echo "Could not archive pre-off snapshots after five attempts."
          exit 1
