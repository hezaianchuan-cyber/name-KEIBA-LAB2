name: Capture NAR pre-off odds every five minutes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nar_odds.py'
      - 'scripts/publish_model_snapshots.py'
      - 'scripts/build_auto_ticket_plans.py'
      - 'scripts/nar_model_g.py'
      - 'tests/test_nar_model_g.py'
      - '.github/workflows/nar-preoff-odds.yml'
  workflow_dispatch:
  schedule:
    # Offset away from the top of the hour, when GitHub Actions scheduled
    # workflows are more likely to be delayed or dropped.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: nar-preoff-odds-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current official NAR race and odds archives
        shell: bash
        run: |
          set +e
          mkdir -p data
          BASE="https://www.keiba.go.jp/KeibaWeb/DataDownload"
          fetch_zip() {
            name="$1"
            endpoint="$2"
            tmp="data/${name}.zip.tmp"
            out="data/${name}.zip"
            if curl -fLsS --retry 1 --retry-delay 2 --max-time 45 "$BASE/$endpoint" -o "$tmp" && unzip -t "$tmp" >/dev/null 2>&1; then
              mv "$tmp" "$out"
              echo "$name=updated"
            else
              rm -f "$tmp"
              echo "$name=unavailable"
            fi
          }
          fetch_zip latest-race "RaceDataDownload?type=daily"
          fetch_zip latest-odds "OddsDataDownload?type=daily"

      - name: Capture timestamped pre-off snapshots
        run: python3 scripts/capture_nar_odds.py

      - name: Archive locked model snapshots to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: https://mwiinzmnoludksnfnjaa.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13aWluem1ub2x1ZGtzbmZuamFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2OTY3ODEsImV4cCI6MjEwOTI3Mjc4MX0.chF7IsxctYMdKdDz39dwKTCJs-sUQbuO7XafIx5_kic
          NAR_CAPTURE_TOKEN: ${{ secrets.NAR_CAPTURE_TOKEN }}
        run: python3 scripts/publish_model_snapshots.py

      - name: Build automatic ticket plans from captured snapshots
        run: python3 scripts/build_auto_ticket_plans.py

      - name: Preserve source archives for race-safe retry
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/nar-capture-source
          for name in latest-race latest-odds; do
            if [ -s "data/${name}.zip" ]; then
              cp "data/${name}.zip" "/tmp/nar-capture-source/${name}.zip"
            fi
          done

      - name: Commit new snapshots and automatic plans with race-safe retry
        shell: bash
        env:
          SUPABASE_URL: https://mwiinzmnoludksnfnjaa.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13aWluem1ub2x1ZGtzbmZuamFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2OTY3ODEsImV4cCI6MjEwOTI3Mjc4MX0.chF7IsxctYMdKdDz39dwKTCJs-sUQbuO7XafIx5_kic
          NAR_CAPTURE_TOKEN: ${{ secrets.NAR_CAPTURE_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # A rejected push followed by reset removes uncommitted files.
            # Reuse the validated archives from this run: the official
            # download endpoint can return a transient 404 on a retry.
            mkdir -p data
            for name in latest-race latest-odds; do
              if [ -s "/tmp/nar-capture-source/${name}.zip" ]; then
                cp "/tmp/nar-capture-source/${name}.zip" "data/${name}.zip"
              elif [ ! -s "data/${name}.zip" ]; then
                echo "Missing source archive: ${name}.zip"
                exit 1
              fi
            done
            # Recompute against the latest main tree using the same source
            # archives so concurrent captures cannot duplicate snapshots.
            python3 scripts/capture_nar_odds.py
            python3 scripts/publish_model_snapshots.py || echo "Supabase model snapshot publish failed; GitHub gzip archive remains available as fallback."
            python3 scripts/build_auto_ticket_plans.py
            git add data/odds-snapshots data/odds-capture-status.json data/auto-ticket-plans.json
            # Publish the official ZIP archives consumed by the web race/runner importer.
            git add -f data/latest-race.zip data/latest-odds.zip
            if git diff --cached --quiet; then
              echo "No new snapshot or status changes."
              exit 0
            fi
            git commit -m "Archive official pre-off odds snapshots and capture status"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying from latest main (attempt $attempt)"
            sleep 2
          done
          echo "Could not archive pre-off snapshots after five attempts."
          exit 1
