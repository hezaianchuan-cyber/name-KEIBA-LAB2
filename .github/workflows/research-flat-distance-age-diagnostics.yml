name: Research flat-only distance and age diagnostics

on:
  push:
    branches:
      - research/flat-distance-age-redesign
    paths:
      - '.github/workflows/research-flat-distance-age-diagnostics.yml'
      - 'scripts/research_flat_distance_age_diagnostics.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-distance-age-diagnostics
  cancel-in-progress: false

jobs:
  distance-age-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-distance-age-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
          key: nar-flat-distance-age-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-${{ runner.os }}-
            nar-parsed-v1-${{ runner.os }}-
      - name: Compile research code
        run: python -m py_compile scripts/nar_backtest.py scripts/research_flat_distance_age_diagnostics.py
      - name: Run leakage-safe flat-only diagnostics
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_distance_age_diagnostics.py
      - name: Upload diagnostics report
        uses: actions/upload-artifact@v4
        with:
          name: flat-distance-age-diagnostics
          path: data/research-flat-distance-age-diagnostics.json
          if-no-files-found: error
          retention-days: 30
