name: Research axis longshot tests
on:
  push:
    branches:
      - research/axis-longshot-10-ticket
    paths:
      - 'scripts/nar_axis_longshot_research.py'
      - 'scripts/nar_trio_lambdarank_market_fusion_5day.py'
      - 'tests/test_nar_axis_longshot_research.py'
      - '.github/workflows/axis-longshot-research-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile and run focused tests
        run: |
          python -m py_compile scripts/nar_axis_longshot_research.py scripts/nar_trio_lambdarank_market_fusion_5day.py
          python -m unittest discover -s tests -p 'test_nar_axis_longshot_research.py'
          python -m unittest discover -s tests -p 'test_nar_trio_lambdarank_market_fusion.py'
