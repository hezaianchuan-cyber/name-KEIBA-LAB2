name: Research flat LambdaRank A-B walk-forward validation
on:
  push:
    branches: [research/lambdarank-walk-forward-ab]
    paths:
      - 'scripts/research_flat_lambdarank_walk_forward_ab.py'
      - '.github/workflows/research-flat-lambdarank-walk-forward-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-lambdarank-walk-forward-ab
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile research scripts
        run: python -m py_compile scripts/research_flat_lambdarank_walk_forward_ab.py scripts/research_flat_lambdarank_feature_ablation.py scripts/nar_ml_challenger_backtest.py scripts/nar_backtest.py
      - name: Run pre-registered A-B walk-forward validation
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_lambdarank_walk_forward_ab.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lambdarank-walk-forward-ab
          path: data/flat-lambdarank-walk-forward-ab.json
          if-no-files-found: warn
          retention-days: 30
