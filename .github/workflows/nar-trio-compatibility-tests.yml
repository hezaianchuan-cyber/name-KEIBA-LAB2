name: Test NAR trio compatibility research module

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_trio_compatibility.py'
      - 'tests/test_nar_trio_compatibility.py'
      - '.github/workflows/nar-trio-compatibility-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nar-trio-compatibility-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m py_compile scripts/nar_trio_compatibility.py
          python -m unittest discover -s tests -p 'test_nar_trio_compatibility.py'
