name: G4 real pre-off odds backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_model_g4_preoff_backtest.py'
      - 'scripts/nar_daily_review.py'
      - 'scripts/publish_model_snapshots.py'
      - 'tests/test_publish_model_snapshots.py'
      - 'tests/test_g4_market_blends.py'
      - 'tests/test_g4_supabase_pagination.py'
      - 'tests/test_nar_backtest.py'
      - 'data/daily-payouts.json'
      - '.github/workflows/nar-model-g4-preoff.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: nar-model-g4-preoff
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test delta-only model snapshot publishing
        run: python3 -m unittest discover -s tests -p 'test_publish_model_snapshots.py' -v
      - name: Compile G4 evaluator
        run: python3 -m py_compile scripts/nar_model_g4_preoff_backtest.py
      - name: Test pre-off market blend diagnostics
        run: python3 -m unittest discover -s tests -p 'test_g4_market_blends.py' -v
      - name: Test bounded per-day Supabase pagination
        run: python3 -m unittest discover -s tests -p 'test_g4_supabase_pagination.py' -v
      - name: Run G4 with captured pre-off odds only
        run: python3 scripts/nar_model_g4_preoff_backtest.py
      - name: Validate market comparison diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/model-g4-preoff-backtest.json").read_text(encoding="utf-8"))
          holdout = (report.get("closest_to_post") or {}).get("holdout") or {}
          blend = holdout.get("blend_candidate_comparison") or {}
          expected = {"0.00", "0.25", "0.50", "0.75", "1.00"}
          if set(blend) != expected:
              raise SystemExit("Missing one or more predeclared market blend candidates")
          for key in expected:
              if blend[key].get("races") != report["closest_to_post"].get("holdout_races"):
                  raise SystemExit("Blend candidates are not compared on identical holdout races")
          required = ("market_rank_disagreement", "market_edge_conditions", "time_bucket_market_movement")
          missing = [key for key in required if key not in report]
          if missing:
              raise SystemExit("Missing market diagnostics: " + ", ".join(missing))
          print("Validated 5 market blends and rank/odds movement diagnostics")
          PY
      - name: Build daily performance review from refreshed G4 results
        run: python3 scripts/nar_daily_review.py
      - name: Validate daily review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/daily-review.json").read_text(encoding="utf-8"))
          required = ("generated_at", "as_of_date_jst", "daily_official_results",
                      "prospective_preoff_evaluation_G4", "weight_research", "warnings")
          missing = [key for key in required if key not in report]
          if missing:
              raise SystemExit("Daily review schema missing: " + ", ".join(missing))
          g4 = report["prospective_preoff_evaluation_G4"]
          g4_report = json.loads(Path("data/model-g4-preoff-backtest.json").read_text(encoding="utf-8"))
          if g4.get("generated_at") != g4_report.get("generated_at"):
              raise SystemExit("Daily review does not contain the latest G4 report")
          print("Validated refreshed daily review:", report["status"], report["as_of_date_jst"],
                "G4=", g4.get("generated_at"))
          PY
      - name: Publish G4 report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/model-g4-preoff-backtest.json /tmp/model-g4-preoff-backtest.json
          cp data/daily-review.json /tmp/daily-review.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/model-g4-preoff-backtest.json data/model-g4-preoff-backtest.json
            cp /tmp/daily-review.json data/daily-review.json
            git add data/model-g4-preoff-backtest.json data/daily-review.json
            if git diff --cached --quiet; then
              echo "G4 report is already current."
              exit 0
            fi
            git commit -m "Publish G4 backtest and refreshed daily review"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update; retrying against latest main (attempt $attempt)"
            sleep 2
          done
          echo "Could not publish G4 report after five attempts."
          exit 1
