name: NAR three-year historical backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_backtest.py'
      - '.github/workflows/nar-historical-backtest.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: nar-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore official monthly archive cache
        uses: actions/cache@v4
        with:
          path: .cache/nar-monthly
          key: nar-monthly-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-${{ runner.os }}-

      - name: Run three-year backtest
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
        run: python3 scripts/nar_backtest.py

      - name: Publish aggregate report only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keiba-report
          cp data/backtest-summary.json data/live-model.json data/live-history.json data/trifecta-research.json /tmp/keiba-report/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/keiba-report/* data/
            git add data/backtest-summary.json data/live-model.json data/live-history.json data/trifecta-research.json
            if git diff --cached --quiet; then
              echo "No report changes"
              exit 0
            fi
            git commit -m "Update NAR three-year backtest summary"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict; retrying against latest main (attempt $attempt)"
            sleep 2
          done
          echo "Could not publish report after 5 attempts"
          exit 1

