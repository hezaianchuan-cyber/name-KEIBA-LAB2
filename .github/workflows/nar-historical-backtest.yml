name: NAR one-year historical backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 3 * *"

permissions:
  contents: write

concurrency:
  group: nar-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run one-year backtest
        run: python3 scripts/nar_backtest.py

      - name: Publish aggregate report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest-summary.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update NAR one-year backtest summary"
            git push
          fi
