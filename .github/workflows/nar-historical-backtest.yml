name: NAR four-year backtest (3-year train + 1-year holdout)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nar_backtest.py'
      - 'tests/test_nar_backtest.py'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nar_backtest.py'
      - 'tests/test_nar_backtest.py'
      - '.github/workflows/nar-historical-backtest.yml'
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: nar-historical-backtest-rank-gap-v4
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore official monthly archive cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-odds-monthly
          key: nar-monthly-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-${{ runner.os }}-

      - name: Restore parsed monthly data cache
        uses: actions/cache@v4
        with:
          path: .cache/nar-parsed
          key: nar-parsed-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-parsed-v1-${{ runner.os }}-

      - name: Compile Python sources
        id: compile
        run: python3 -m compileall -q scripts tests

      - name: Run backtest unit tests
        id: unit-tests
        run: python3 -m unittest discover -s tests -p 'test_nar_backtest.py'

      - name: Run four-year backtest with final one-year holdout
        id: full-backtest
        if: github.event_name != 'pull_request'
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_ODDS_CACHE_DIR: .cache/nar-odds-monthly
          NAR_BACKTEST_CHECKPOINT_TOKEN: ${{ github.token }}
        run: python3 scripts/nar_backtest.py

      - name: Publish aggregate report only
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keiba-report
          cp data/backtest-summary.json data/trifecta-research.json data/backtest-1-model-comparison.json data/backtest-2-ticket-strategy.json data/backtest-3-condition-robustness.json data/backtest-5-feature-ablation.json /tmp/keiba-report/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/keiba-report/* data/
            git add data/backtest-summary.json data/trifecta-research.json data/backtest-1-model-comparison.json data/backtest-2-ticket-strategy.json data/backtest-3-condition-robustness.json data/backtest-5-feature-ablation.json
            if git diff --cached --quiet; then
              echo "No report changes"
              exit 0
            fi
            git commit -m "Update NAR four-year backtest summary"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict; retrying against latest main (attempt $attempt)"
            sleep 2
          done
          echo "Could not publish report after 5 attempts"
          exit 1


      - name: Write test and backtest status summary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
          BACKTEST_OUTCOME: ${{ steps.full-backtest.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## KEIBA LAB — 検証状況"
            echo
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| Python構文チェック | ${COMPILE_OUTCOME:-未実行} |"
            echo "| 単体テスト | ${UNIT_TEST_OUTCOME:-未実行} |"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "| 4年バックテスト | PR検証では未実行（本番実行を保護） |"
            else
              echo "| 4年バックテスト | ${BACKTEST_OUTCOME:-未実行} |"
            fi
            echo
            echo "詳細ログは各ステップを開いて確認できます。"
          } >> "$GITHUB_STEP_SUMMARY"
