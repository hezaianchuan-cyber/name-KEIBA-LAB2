name: Research LAB axis vs pre-off market favorite comparison

on:
  push:
    branches:
      - research/conditional-axis-pair-ranker
    paths:
      - 'scripts/nar_axis_market_favorite_comparison.py'
      - 'scripts/nar_backtest.py'
      - 'scripts/horse_evaluation_model.py'
      - 'data/odds-snapshots/**'

permissions:
  contents: read

concurrency:
  group: research-axis-market-favorite-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/conditional-axis-pair-ranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn lightgbm
      - name: Compile research modules
        run: python -m py_compile scripts/nar_backtest.py scripts/horse_evaluation_model.py scripts/nar_axis_pair_walkforward_backtest.py scripts/nar_axis_market_favorite_comparison.py
      - name: Run same-race pre-off market comparison
        run: python scripts/nar_axis_market_favorite_comparison.py
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: axis-market-favorite-comparison
          path: data/axis-market-favorite-comparison.json
          if-no-files-found: error
          retention-days: 30
