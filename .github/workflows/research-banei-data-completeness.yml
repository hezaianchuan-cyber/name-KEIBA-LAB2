name: Research Banei data completeness audit

on:
  push:
    branches:
      - research/conditional-axis-pair-ranker
    paths:
      - '.github/workflows/research-banei-data-completeness.yml'
      - 'scripts/research_banei_data_completeness.py'
      - 'scripts/nar_backtest.py'

permissions:
  contents: read

concurrency:
  group: research-banei-data-completeness
  cancel-in-progress: false

jobs:
  banei-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/conditional-axis-pair-ranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn lightgbm
      - name: Compile audit and parser
        run: python -m py_compile scripts/nar_backtest.py scripts/research_banei_data_completeness.py
      - name: Audit Banei archive fields
        run: python scripts/research_banei_data_completeness.py
      - name: Upload Banei completeness report
        uses: actions/upload-artifact@v4
        with:
          name: banei-data-completeness
          path: data/banei-data-completeness.json
          if-no-files-found: error
          retention-days: 30
