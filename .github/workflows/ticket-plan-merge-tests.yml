name: Ticket plan merge regression tests

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/test_ticket_plan_merge.mjs"
      - ".github/workflows/ticket-plan-merge-tests.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/test_ticket_plan_merge.mjs"
      - ".github/workflows/ticket-plan-merge-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_ticket_plan_merge.mjs
