name: Research flat LambdaRank min_child_samples sweep
on:
  push:
    branches: [research/lambdarank-min-child-samples]
    paths:
      - 'scripts/research_flat_lambdarank_min_child_samples.py'
      - '.github/workflows/research-flat-lambdarank-min-child-samples.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-flat-lambdarank-min-child-samples
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm
      - name: Compile scripts
        run: python -m py_compile scripts/research_flat_lambdarank_min_child_samples.py scripts/nar_ml_challenger_backtest.py scripts/nar_backtest.py
      - name: Run min_child_samples sweep
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_lambdarank_min_child_samples.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lambdarank-min-child-samples
          path: data/flat-lambdarank-min-child-samples.json
          if-no-files-found: warn
          retention-days: 30
