name: Run five-day axis longshot research
on:
  push:
    branches:
      - research/axis-longshot-10-ticket
    paths:
      - 'scripts/nar_axis_longshot_research.py'
      - 'scripts/nar_trio_lambdarank_market_fusion_5day.py'
      - 'tests/test_nar_axis_longshot_research.py'
      - '.github/workflows/axis-longshot-five-day-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axis-longshot-five-day-research
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
          key: axis-longshot-research-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-monthly-v1-
            nar-parsed-v1-
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn lightgbm
      - name: Compile and run focused tests
        run: |
          python -m py_compile scripts/nar_axis_longshot_research.py scripts/nar_trio_lambdarank_market_fusion_5day.py
          python -m unittest discover -s tests -p 'test_nar_axis_longshot_research.py'
          python -m unittest discover -s tests -p 'test_nar_trio_lambdarank_market_fusion.py'
      - name: Run five-day research backtest
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/nar_trio_lambdarank_market_fusion_5day.py
      - name: Upload five-day report
        uses: actions/upload-artifact@v4
        with:
          name: axis-longshot-five-day-research
          path: data/nar-trio-lambdarank-market-fusion-5day.json
          if-no-files-found: error
          retention-days: 30
