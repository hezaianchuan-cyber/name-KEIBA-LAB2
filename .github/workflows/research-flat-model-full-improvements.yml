name: Research flat model full improvements

on:
  push:
    branches:
      - research/flat-model-full-improvements
    paths:
      - '.github/workflows/research-flat-model-full-improvements.yml'
      - 'scripts/research_flat_model_full_improvements.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-model-full-improvements
  cancel-in-progress: false

jobs:
  flat-model-full-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-model-full-improvements
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official NAR archive caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nar-monthly
            .cache/nar-parsed
            .cache/nar-odds-monthly
          key: nar-flat-full-improvements-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nar-flat-feature-audit-${{ runner.os }}-
            nar-monthly-v1-${{ runner.os }}-
            nar-parsed-v1-${{ runner.os }}-
            nar-odds-monthly-v1-${{ runner.os }}-
      - name: Compile research and model code
        run: python -m py_compile scripts/nar_backtest.py scripts/research_flat_model_full_improvements.py
      - name: Run four research tracks
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
          NAR_ODDS_CACHE_DIR: .cache/nar-odds-monthly
        run: python scripts/research_flat_model_full_improvements.py
      - name: Upload full improvement report
        uses: actions/upload-artifact@v4
        with:
          name: flat-model-full-improvements
          path: data/research-flat-model-full-improvements.json
          if-no-files-found: error
          retention-days: 30
