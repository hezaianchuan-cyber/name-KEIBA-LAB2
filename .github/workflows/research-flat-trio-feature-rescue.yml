name: Research flat trio feature rescue
on:
  push:
    branches:
      - research/flat-axis-win-blend
    paths:
      - '.github/workflows/research-flat-trio-feature-rescue.yml'
      - 'scripts/research_flat_trio_feature_rescue.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-flat-trio-feature-rescue
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flat-axis-win-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Compile research scripts
        run: python -m py_compile scripts/nar_backtest.py scripts/nar_ml_challenger_backtest.py scripts/research_flat_axis_win_blend.py scripts/research_flat_trio_feature_rescue.py
      - name: Run feature rescue research
        env:
          NAR_CACHE_DIR: .cache/nar-monthly
          NAR_PARSED_CACHE_DIR: .cache/nar-parsed
        run: python scripts/research_flat_trio_feature_rescue.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: flat-trio-feature-rescue
          path: data/flat-trio-feature-rescue.json
          if-no-files-found: error
          retention-days: 30
