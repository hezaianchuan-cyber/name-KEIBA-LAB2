name: Build KEIBA LAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/jp/keibalab/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/jp/keibalab/app/
          cp AndroidManifest.xml app/src/main/
          cp index.html app/src/main/assets/
          cp styles.xml app/src/main/res/values/
          echo "Bundling holdout-validated model"
          python3 - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path("data/live-model.json").read_text(encoding="utf-8"))
          history = json.loads(Path("data/live-history.json").read_text(encoding="utf-8"))
          payload = "window.KEIBA_LAB_LEARNED_MODEL=" + json.dumps(model, ensure_ascii=False, separators=(",", ":")) + ";\n"
          payload += "window.KEIBA_LAB_LEARNED_HISTORY=" + json.dumps(history, ensure_ascii=False, separators=(",", ":")) + ";\n"
          Path("app/src/main/assets/learned-data.js").write_text(payload, encoding="utf-8")
          index_path = Path("app/src/main/assets/index.html")
          html = index_path.read_text(encoding="utf-8")
          first_script = html.find("<script")
          if first_script < 0:
              raise SystemExit("index.html has no script element")
          html = html[:first_script] + '<script src="learned-data.js"></script>\n' + html[first_script:]
          index_path.write_text(html, encoding="utf-8")
          print("Bundled trained weights and historical feature snapshot into APK")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'KEIBA-LAB'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'jp.keibalab.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'jp.keibalab.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA-LAB-APK
          path: app/build/outputs/apk/debug/app-debug.apk