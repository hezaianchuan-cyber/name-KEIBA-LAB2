name: KEIBALAB Research DB Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - research/keibalab-db-foundation
    paths:
      - "research_db/**"
      - "scripts/import_research_db.py"
      - "scripts/sync_research_db_local.py"
      - "scripts/export_research_backtest_dataset.py"
      - "scripts/setup_research_db_task.ps1"
      - "tests/test_local_research_db_sync.py"
      - "tests/test_research_db_schema.py"
      - "tests/test_nar_archive_research_import.py"
      - "scripts/import_nar_archive_to_research_db.py"
      - "data/research-a45-predictions.jsonl"
      - "data/research-a45-odds-joined.jsonl"
      - ".github/workflows/research-db-smoke-test.yml"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research DB branch
        uses: actions/checkout@v4
        with:
          ref: research/keibalab-db-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run schema tests
        run: python -m unittest discover -s tests -p "test_*research*.py" -v

      - name: Build local SQLite database from frozen A45 data
        run: python scripts/import_research_db.py

      - name: Verify importer is idempotent
        run: |
          python scripts/import_research_db.py
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/keibalab-research.sqlite")
          expected = {"races": 3, "runners": 34, "model_predictions": 34, "odds_snapshots": 66}
          actual = {t: db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0] for t in expected}
          assert actual == expected, {"expected": expected, "actual": actual}
          print("Idempotency verified:", actual)
          PY

      - name: Sync live odds, frozen predictions, daily results and payouts
        run: |
          python scripts/sync_research_db_local.py
          python scripts/export_research_backtest_dataset.py --race-type flat

      - name: Verify database integrity and print counts
        run: |
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("data/keibalab-research.sqlite")
          db.execute("PRAGMA foreign_keys=ON")
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          foreign_keys = db.execute("PRAGMA foreign_key_check").fetchall()
          counts = {}
          for table in ("races", "runners", "model_predictions", "odds_snapshots"):
              counts[table] = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
          print(json.dumps({
              "integrity_check": integrity,
              "foreign_key_violations": foreign_keys,
              "counts": counts
          }, ensure_ascii=False, indent=2))
          assert integrity == "ok"
          assert not foreign_keys
          assert counts["races"] > 0
          assert counts["model_predictions"] > 0
          PY

      - name: Upload SQLite database artifact
        uses: actions/upload-artifact@v4
        with:
          name: keibalab-research-sqlite
          path: data/keibalab-research.sqlite
          retention-days: 7
          if-no-files-found: error
