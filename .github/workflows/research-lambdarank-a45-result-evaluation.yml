name: Research A45 3連複 result evaluation

on:
  push:
    branches: [research/lambdarank-a45-preoff-capture]
    paths:
      - 'scripts/research_flat_lambdarank_a45_trio_evaluation.py'
      - 'tests/test_research_a45_trio_evaluation.py'
      - '.github/workflows/research-lambdarank-a45-result-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-a45-result-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/lambdarank-a45-preoff-capture
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest official NAR daily result archive from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          mkdir -p data/research-a45-result-source
          git show origin/main:data/latest-race.zip > data/research-a45-result-source/latest-race.zip
          unzip -t data/research-a45-result-source/latest-race.zip >/dev/null

      - name: Install result parser dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost lightgbm

      - name: Compile and test result-only scoring
        run: |
          python -m py_compile scripts/research_flat_lambdarank_a45_trio_evaluation.py scripts/nar_backtest.py
          python -m unittest discover -s tests -p 'test_research_a45_trio_evaluation.py' -v

      - name: Evaluate A45 and market tickets against official 3連複 payouts
        run: python scripts/research_flat_lambdarank_a45_trio_evaluation.py

      - name: Persist research evaluation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research-a45-trio-evaluation.json data/research-a45-trio-evaluation-report.json
          if git diff --cached --quiet; then
            echo "No evaluation changes."
          else
            git commit -m "Archive A45 trio result evaluation"
            git push origin HEAD:research/lambdarank-a45-preoff-capture
          fi

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a45-trio-result-evaluation
          path: |
            data/research-a45-trio-evaluation.json
            data/research-a45-trio-evaluation-report.json
          if-no-files-found: warn
          retention-days: 30
